---
- hosts: all
  become: yes
  vars:
    ansible_python_interpreter: "/usr/bin/python3"

    sonar_server_name: "sonar-labs"
    sonar_server_credentials_id: "sonar-token"
    sonar_scanner_tool_name: "SonarScanner"
    sonar_scanner_version: "6.2.1.4610"
    sonar_jenkins_webhook_name: "Jenkins"
    sonar_jenkins_webhook_url: "https://{{ jenkins_host }}/sonarqube-webhook/"

  vars_files:
    - vars.yml

  tasks:
    - include_tasks: 'user_details.yml'
    - include_tasks: 'vault_token.yml'
    - include_tasks: 'vault_token_jenkins.yml'
    - include_tasks: 'vault_token_sonar.yml'

    # ------------------------------------------------------------------
    # Sonar | Jenkins: Manage Jenkins > System > SonarQube servers
    #               + Global Tool Configuration > SonarScanner
    # ------------------------------------------------------------------
    - name: Jenkins | Get crumb (CSRF token)
      ansible.builtin.uri:
        url: "https://{{ jenkins_host }}/crumbIssuer/api/json"
        method: GET
        user: "admin"
        password: "{{ jenkins_admin_password }}"
        force_basic_auth: yes
        validate_certs: false
        return_content: yes
        status_code: 200
      register: crumb_json
      retries: 30
      delay: 5
      until: crumb_json.status == 200

    - name: Jenkins | Build CSRF header
      ansible.builtin.set_fact:
        jenkins_crumb_header: >-
          {{
            {
              crumb_json.json.crumbRequestField:
              crumb_json.json.crumb
            }
          }}

    - name: Jenkins | Configure SonarQube server "{{ sonar_server_name }}"
      ansible.builtin.uri:
        url: "https://{{ jenkins_host }}/scriptText"
        method: POST
        user: "admin"
        password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        headers: "{{ jenkins_crumb_header | combine({'Cookie': crumb_json.cookies_string}) | combine({'Content-Type': 'application/x-www-form-urlencoded'}) }}"
        body_format: form-urlencoded
        body:
          script: |
            import jenkins.model.Jenkins
            import hudson.plugins.sonar.SonarGlobalConfiguration
            import hudson.plugins.sonar.SonarInstallation
            import hudson.plugins.sonar.model.TriggersConfig
            import hudson.util.Secret

            def cfg = Jenkins.instance.getDescriptorByType(SonarGlobalConfiguration.class)
            def name    = "{{ sonar_server_name }}"
            def url     = "https://{{ sonar_host }}"
            def credId  = "{{ sonar_server_credentials_id }}"
            def trig    = new TriggersConfig()

            // Assinaturas historicas do construtor (descobertas por reflection):
            //   v2.18+ (9-arg, com Secret webhookSecret e credentialsBindingId):
            //     name, serverUrl, credentialsId, Secret webhookSecret,
            //     mojoVersion, additionalProperties,
            //     additionalAnalysisProperties, credentialsBindingId, triggers
            //   v2.13-2.17 (8-arg, todas String + TriggersConfig):
            //     name, serverUrl, credentialsId, webhookSecretId,
            //     mojoVersion, additionalProperties,
            //     additionalAnalysisProperties, triggers
            //   7-arg legado (ordem incomum, triggers na pos 5):
            //     name, serverUrl, credentialsId, mojoVersion,
            //     additionalProperties, triggers, additionalAnalysisProperties
            //   v2.10-2.12 (7-arg, todas String + TriggersConfig na pos 6):
            //     name, serverUrl, credentialsId, mojoVersion,
            //     additionalProperties, additionalAnalysisProperties, triggers
            //   v2.5-2.9 (7-arg com boolean disabled na pos 1):
            //     name, disabled, serverUrl, credentialsId, mojoVersion,
            //     additionalProperties, triggers
            def inst = null
            def attempts = []
            for (ctor in SonarInstallation.class.getDeclaredConstructors().sort { -it.parameterCount }) {
              def types = ctor.getParameterTypes()
              def n = types.length
              def args = null
              if (n == 9 && types[3] == Secret.class) {
                args = [name, url, credId, null, "", "", "", "", trig]
              } else if (n == 8 && types[1] == String.class) {
                args = [name, url, credId, "", "", "", "", trig]
              } else if (n == 7 && types[5] == TriggersConfig.class) {
                args = [name, url, credId, "", "", trig, ""]
              } else if (n == 7 && types[1] == String.class) {
                args = [name, url, credId, "", "", "", trig]
              } else if (n == 7 && types[1] == Boolean.TYPE) {
                args = [name, false, url, credId, "", "", trig]
              }
              if (args == null) {
                attempts << "${n}-arg(${types.collect{it.simpleName}.join(',')}): nao suportado"
                continue
              }
              try {
                inst = ctor.newInstance(args as Object[])
                break
              } catch (Throwable t) {
                attempts << "${n}-arg(${types.collect{it.simpleName}.join(',')}): ${t.message}"
              }
            }
            if (inst == null) {
              throw new RuntimeException("Cannot build SonarInstallation. Tried: " + attempts.join(" | "))
            }

            cfg.setInstallations([inst] as SonarInstallation[])
            cfg.setBuildWrapperEnabled(true)
            cfg.save()
            println "OK"
        return_content: true
        status_code: 200
        validate_certs: false
      register: jenkins_sonar_cfg
      failed_when: >-
        (jenkins_sonar_cfg.content | default('') | trim) != 'OK'

    - name: Jenkins | Configure SonarScanner tool "{{ sonar_scanner_tool_name }}"
      ansible.builtin.uri:
        url: "https://{{ jenkins_host }}/scriptText"
        method: POST
        user: "admin"
        password: "{{ jenkins_admin_password }}"
        force_basic_auth: true
        headers: "{{ jenkins_crumb_header | combine({'Cookie': crumb_json.cookies_string}) | combine({'Content-Type': 'application/x-www-form-urlencoded'}) }}"
        body_format: form-urlencoded
        body:
          script: |
            import jenkins.model.Jenkins
            import hudson.plugins.sonar.SonarRunnerInstallation
            import hudson.plugins.sonar.SonarRunnerInstaller
            import hudson.tools.InstallSourceProperty

            def descriptor = Jenkins.instance.getDescriptorByType(SonarRunnerInstallation.DescriptorImpl.class)
            def installer = new SonarRunnerInstaller("{{ sonar_scanner_version }}")
            def src = new InstallSourceProperty([installer])
            def installation = new SonarRunnerInstallation("{{ sonar_scanner_tool_name }}", "", [src])
            descriptor.setInstallations(installation)
            descriptor.save()
            println "OK"
        return_content: true
        status_code: 200
        validate_certs: false
      register: jenkins_scanner_cfg
      failed_when: >-
        (jenkins_scanner_cfg.content | default('') | trim) != 'OK'

    # ------------------------------------------------------------------
    # Sonar | webhook -> Jenkins (required for waitForQualityGate)
    # ------------------------------------------------------------------
    - name: Sonar | List existing webhooks (global)
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/webhooks/list"
        method: GET
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
        validate_certs: false
      register: sonar_webhooks_list

    - name: Sonar | Find webhook matching Jenkins URL
      ansible.builtin.set_fact:
        sonar_jenkins_webhook_existing: >-
          {{
            (sonar_webhooks_list.json.webhooks | default([]))
            | selectattr('url', 'equalto', sonar_jenkins_webhook_url)
            | list
          }}

    - name: Sonar | Delete duplicate Jenkins webhooks (keep only first)
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/webhooks/delete"
        method: POST
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          webhook: "{{ item.key }}"
        status_code: [200, 204]
        validate_certs: false
      loop: "{{ sonar_jenkins_webhook_existing[1:] }}"
      when: (sonar_jenkins_webhook_existing | length) > 1

    - name: Sonar | Create Jenkins webhook (if missing)
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/webhooks/create"
        method: POST
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          name: "{{ sonar_jenkins_webhook_name }}"
          url: "{{ sonar_jenkins_webhook_url }}"
        status_code: [200]
        validate_certs: false
      when: (sonar_jenkins_webhook_existing | length) == 0

    # ------------------------------------------------------------------
    # Sonar | Quality Gate "Sec4US Strict"
    # Stricter than the built-in Sonar Way: zero new vulnerabilities/bugs,
    # 100% hotspot review, all ratings = A, coverage >= 80%, duplication <= 3%.
    # All conditions are evaluated on NEW code ("Clean as You Code").
    # ------------------------------------------------------------------
    - name: Sonar | List existing Quality Gates
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/qualitygates/list"
        method: GET
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
        validate_certs: false
      register: sonar_qg_list

    - name: Sonar | Determine if "Sec4US Strict" gate already exists
      ansible.builtin.set_fact:
        sonar_strict_gate_exists: >-
          {{
            ((sonar_qg_list.json.qualitygates | default([]))
             | selectattr('name', 'equalto', 'Sec4US Strict')
             | list | length) > 0
          }}

    - name: Sonar | Create "Sec4US Strict" Quality Gate
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/qualitygates/create"
        method: POST
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          name: "Sec4US Strict"
        status_code: [200]
        validate_certs: false
      when: not sonar_strict_gate_exists

    - name: Sonar | Show "Sec4US Strict" current conditions
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/qualitygates/show?name=Sec4US%20Strict"
        method: GET
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
        validate_certs: false
      register: sonar_strict_gate_show

    - name: Sonar | Set fact with existing condition metrics
      ansible.builtin.set_fact:
        sonar_strict_existing_metrics: >-
          {{
            (sonar_strict_gate_show.json.conditions | default([]))
            | map(attribute='metric') | list
          }}

    - name: Sonar | Add missing conditions to "Sec4US Strict"
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/qualitygates/create_condition"
        method: POST
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          gateName: "Sec4US Strict"
          metric: "{{ item.metric }}"
          op: "{{ item.op }}"
          error: "{{ item.error }}"
        status_code: [200, 400]
        validate_certs: false
      loop:
        - { metric: "new_security_rating",            op: "GT", error: "1" }
        - { metric: "new_vulnerabilities",            op: "GT", error: "0" }
        - { metric: "new_security_hotspots_reviewed", op: "LT", error: "100" }
        - { metric: "new_reliability_rating",         op: "GT", error: "1" }
        - { metric: "new_bugs",                       op: "GT", error: "0" }
        - { metric: "new_maintainability_rating",     op: "GT", error: "1" }
        - { metric: "new_coverage",                   op: "LT", error: "80" }
        - { metric: "new_duplicated_lines_density",   op: "GT", error: "3" }
      when: item.metric not in sonar_strict_existing_metrics
