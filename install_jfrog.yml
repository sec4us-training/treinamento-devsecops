---
- hosts: all
  become: yes
  vars:
    ansible_python_interpreter: "/usr/bin/python3"
    ARTIFACTORY_HOME: /u01/artifactory
    jfrog_url: "http://127.0.0.1:8082"           # Router/Access
    jfrog_admin_user: "admin"
    jfrog_admin_current_password: "@Pass123"       # senha do snapshot, rotacionada pelo deploy
    jfrog_artifactory_version: "7.111.9"
    jfrog_postgres_version: "13.23-alpine"
    jfrog_snapshot_local: "templates/jfrog/snapshot.tar.gz"
    jfrog_snapshot_remote: "/tmp/jfrog_snapshot.tar.gz"

  vars_files:
    - vars.yml

  tasks:
    - include_tasks: 'user_details.yml'
    - include_tasks: 'vault_token.yml'

    - name: Artifactory | Configuring NGINX
      copy:
        dest: "/etc/nginx/conf.d/artifactory.conf"
        owner: root
        group: root
        mode: 0644
        force: yes
        content: |
          server {
              listen        443 ssl;
              server_name {{ artifactory_host }};

              ssl_certificate      /etc/nginx/certs/ssl.cer;
              ssl_certificate_key  /etc/nginx/certs/ssl.key;

              # Override the 10m global cap; Artifactory hosts large
              # binaries (Docker layers, JARs, CI build outputs).
              client_max_body_size 100000M;

              root /dev/null;
              index index.html index.htm;
              try_files $uri $uri/ $uri/404 =404;

              location / {
                  proxy_http_version    1.1;
                  proxy_ssl_verify      off;
                  proxy_set_header      Host                $host;
                  proxy_set_header      X-Real-IP           $remote_addr;
                  proxy_set_header      X-Forwarded-For     $remote_addr;
                  proxy_set_header      X-Forwarded-Proto   $scheme;
                  proxy_pass http://127.0.0.1:8082;
              }
          
          }

    - name: Artifactory | Reload nginx config
      shell: |
        nginx -s reload

    - name: Artifactory | Stop service, if exists
      shell: |
        cd {{ ARTIFACTORY_HOME }}
        docker compose down -v
      ignore_errors: true

    - name: Artifactory | Remove directories
      file:
        path: "{{ item.path }}"
        state: absent
      with_items:
          - { path: "{{ ARTIFACTORY_HOME }}/artifactory/etc" } 
          - { path: "{{ ARTIFACTORY_HOME }}/postgres" }
          - { path: "{{ ARTIFACTORY_HOME }}" }

    - name: Artifactory | Create base directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "root"
        group: "root"
        mode: 0777
      with_items:
          - { path: "{{ ARTIFACTORY_HOME }}" }
          - { path: "{{ ARTIFACTORY_HOME }}/postgres" }
          - { path: "{{ ARTIFACTORY_HOME }}/artifactory" }

    - name: Artifactory | Upload snapshot tarball
      copy:
        src: "{{ jfrog_snapshot_local }}"
        dest: "{{ jfrog_snapshot_remote }}"
        mode: 0644

    - name: Artifactory | Extract snapshot bundle
      ansible.builtin.unarchive:
        src: "{{ jfrog_snapshot_remote }}"
        dest: "/tmp"
        remote_src: true

    - name: Artifactory | Restore etc/ from snapshot (config + master.key + join.key)
      ansible.builtin.unarchive:
        src: "/tmp/jfrog_snapshot/etc.tar.gz"
        dest: "{{ ARTIFACTORY_HOME }}/artifactory"
        remote_src: true

    - name: Artifactory | Creating docker-compose.yml
      copy:
        dest: "{{ ARTIFACTORY_HOME }}/docker-compose.yml"
        content: |
          services:

            postgres:
              image: "postgres:{{ jfrog_postgres_version }}"
              container_name: jfrog-postgres
              restart: always
              environment:
                TZ: America/Sao_Paulo
                POSTGRES_DB: artifactory
                POSTGRES_USER: artifactory
                POSTGRES_PASSWORD: "ArtifactorySec4USLabP@sS"
              volumes:
                - "{{ ARTIFACTORY_HOME }}/postgres:/var/lib/postgresql/data"
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U artifactory -d artifactory"]
                interval: 10s
                timeout: 5s
                retries: 30

            artifactory:
              image: "releases-docker.jfrog.io/jfrog/artifactory-oss:{{ jfrog_artifactory_version }}"
              container_name: jfrog-artifactory
              restart: unless-stopped

              ports:
                - "8081:8081"   # Artifactory UI / API
                - "8082:8082"   # (opcional, alguns repos usam)

              extra_hosts:
                - "{{vault_host}}:host-gateway"
                - "{{gitlab_host}}:host-gateway"
                - "{{artifactory_host}}:host-gateway"
                - "{{jenkins_host}}:host-gateway"
                - "{{sonar_host}}:host-gateway"
                - "{{web01_host}}:host-gateway"
                - "{{registry_host}}:host-gateway"

              volumes:
                - {{ ARTIFACTORY_HOME }}/artifactory:/var/opt/jfrog/artifactory

              environment:
                - TZ=America/Sao_Paulo
                - JF_SHARED_NODE_IP=0.0.0.0
                - JF_ROUTER_ENTRYPOINTS_EXTERNALPORT=8082
                - JF_SYSTEM_YAML=/var/opt/jfrog/artifactory/var/etc/system.yaml

              ulimits:
                nofile:
                  soft: 65536
                  hard: 65536


    - name: Artifactory | Start postgres only
      shell: |
        cd {{ ARTIFACTORY_HOME }}
        docker compose up -d postgres

    - name: Artifactory | Wait postgres healthy
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Health.Status{{ "}}" }}' jfrog-postgres
      register: jfrog_pg_health
      retries: 30
      delay: 5
      until: jfrog_pg_health.stdout == "healthy"
      changed_when: false

    - name: Artifactory | Restore postgres dump from snapshot
      shell: |
        docker exec -i jfrog-postgres psql -U artifactory -d artifactory -v ON_ERROR_STOP=1 < /tmp/jfrog_snapshot/artifactory.sql
      register: jfrog_pg_restore
      changed_when: true

    - name: Artifactory | Start artifactory
      shell: |
        cd {{ ARTIFACTORY_HOME }}
        docker compose up -d artifactory

    - name: Artifactory | Wait for JFrog container to be running
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' jfrog-artifactory
      register: jfrog_running
      retries: 60
      delay: 10
      until: jfrog_running.stdout == "true"
      changed_when: false

    - name: Artifactory | Adjust permissions inside container
      shell: |
        docker exec --user root jfrog-artifactory bash -lc "chown artifactory:artifactory /var/opt/jfrog/artifactory/* -R"

    - name: Artifactory | Wait for Artifactory port 8081
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8081
        delay: 10
        timeout: 300

    - name: Artifactory | Wait for JFrog Artifactory to be ready
      ansible.builtin.uri:
        url: "https://{{ artifactory_host }}/artifactory/api/system/ping"
        method: GET
        validate_certs: false
        return_content: yes
        status_code: 200
      register: jfrog_ping
      retries: 60
      delay: 10
      until: jfrog_ping.content == "OK"

    - name: Artifactory | Create admin access token (via Artifactory token API)
      ansible.builtin.uri:
        url: "https://{{ artifactory_host }}/artifactory/api/security/token"
        method: POST
        validate_certs: false
        user: "{{ jfrog_admin_user }}"
        password: "{{ jfrog_admin_current_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/x-www-form-urlencoded"
        body_format: form-urlencoded
        body:
          username: "{{ jfrog_admin_user }}"
          scope: "member-of-groups:admin"
          expires_in: 3600
        return_content: true
        status_code: 200
      register: token_resp
      no_log: true

    - name: Artifactory | Extract access token
      ansible.builtin.set_fact:
        jfrog_access_token: "{{ (token_resp.json.access_token | default('')) }}"
      no_log: true

    - name: Artifactory | Fail if token was not returned
      ansible.builtin.fail:
        msg: "JFrog did not return access_token. Check jfrog_url/credentials."
      when: jfrog_access_token | length == 0

    - name: Artifactory | Generating new admin password
      ansible.builtin.set_fact:
        jfrog_new_admin_password: "Sec4US@{{ lookup('community.general.random_string', upper=true, lower=true, numbers=true, special=false, length=24) }}"
      no_log: true

    - name: Artifactory | Reset admin password (onboarding step 1)
      ansible.builtin.uri:
        url: "https://{{ artifactory_host }}/artifactory/api/security/users/authorization/changePassword"
        method: POST
        validate_certs: false
        headers:
          Authorization: "Bearer {{ jfrog_access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          userName: "{{ jfrog_admin_user }}"
          oldPassword: "{{ jfrog_admin_current_password }}"
          newPassword1: "{{ jfrog_new_admin_password }}"
          newPassword2: "{{ jfrog_new_admin_password }}"
        status_code: [200, 204]
      no_log: true

    - name: Artifactory | Create long-lived admin access token (post password reset)
      ansible.builtin.uri:
        url: "https://{{ artifactory_host }}/artifactory/api/security/token"
        method: POST
        validate_certs: false
        user: "{{ jfrog_admin_user }}"
        password: "{{ jfrog_new_admin_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/x-www-form-urlencoded"
        body_format: form-urlencoded
        body:
          username: "{{ jfrog_admin_user }}"
          scope: "member-of-groups:admin"
          expires_in: 0
        return_content: true
        status_code: 200
      register: jfrog_admin_token_resp
      retries: 5
      delay: 5
      until: jfrog_admin_token_resp.status == 200
      no_log: true

    - name: Artifactory | Extract admin access token
      ansible.builtin.set_fact:
        jfrog_admin_token: "{{ jfrog_admin_token_resp.json.access_token | default('') }}"
      no_log: true

    - name: Artifactory | Fail if admin access token was not returned
      ansible.builtin.fail:
        msg: "JFrog did not return long-lived admin access_token."
      when: jfrog_admin_token | length == 0

    # Set base URL não é executado: o endpoint /api/system/configuration/baseUrl
    # exige licença Pro/Enterprise (OSS retorna 403). O shared.jfrogUrl no
    # system.yaml também não pode ser usado em single-node OSS (força topologia
    # distribuída e trava o boot esperando jffe/jfcfg). JFrog OSS funciona sem
    # base URL explícita — usa o Host header de cada requisição.

    - name: Artifactory | Admin password
      ansible.builtin.debug:
        msg: "__SEC4US_CRED__::JFrog Admin Password::{{ jfrog_new_admin_password }}"

    - name: Artifactory | Admin access token
      ansible.builtin.debug:
        msg: "__SEC4US_CRED__::JFrog Access Token::{{ jfrog_admin_token }}"

    - name: Artifactory | Store credentials in Vault
      ansible.builtin.uri:
        url: "https://{{ vault_host }}/v1/secret/artifactory/admin"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          url: "https://{{ artifactory_host }}"
          username: "{{ jfrog_admin_user }}"
          password: "{{ jfrog_new_admin_password }}"
          access_token: "{{ jfrog_admin_token }}"
          repo_key: "{{ jfrog_repo_key }}"
        validate_certs: false
        status_code: [200, 204]
      no_log: true


