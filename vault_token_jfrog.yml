- name: Vault | Read jfrog admin
  ansible.builtin.uri:
    url: "https://{{ vault_host }}/v1/secret/artifactory/admin"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_token }}"
    validate_certs: false
    status_code: 200
  register: read_secret
  no_log: true

- name: "Set data"
  set_fact:
    jfrog_admin_username: "{{ read_secret.json.data.username }}"
    jfrog_admin_password: "{{ read_secret.json.data.password }}"
  no_log: true
