---
- hosts: all
  become: yes
  vars:
    ansible_python_interpreter: "/usr/bin/python3"
    GITLAB_HOME: /u01/gitlab
    gitlab_external_url:
    gitlab_api_version:

    sonar_project_key: "sec4us-bank"
    sonar_project_name: "Sec4US Bank"
    sonar_project_visibility: "private"
    sonar_project_token_name: "sec4us-bank-token"

  vars_files:
    - vars.yml

  tasks:
    - include_tasks: 'user_details.yml'
    - include_tasks: 'vault_token.yml'
    - include_tasks: 'vault_token_gitlab.yml'

    - name: GitLab | Set project name
      set_fact:
        gitlab_project_group: "sec4us"
        gitlab_project_name: "bank"
        gitlab_project_visibility: "private"

    - include_tasks: 'gitlab_list_projects.yml'

    - include_tasks: "create_project.yml"

    - name: GitLab | Vault -> Store credentials
      ansible.builtin.uri:
        url: "https://{{ vault_host }}/v1/secret/bank"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          db_user: "bank"
          db_pass: "123456"
        validate_certs: false
        status_code: [200, 204]
      no_log: true

    - name: GitLab | Check if path exists
      stat:
        path: /tmp/bank_git/
      register: git_path

    - name: GitLab | Git clone
      shell: |
        git config --global user.name "Helvio Junior"
        git config --global user.email "helvio@labs.sec4us.com.br"
        chown 600 "{{ GITLAB_HOME }}/id_rsa_root"

        cd /tmp
        rm -rf /tmp/bank_api/
        rm -rf /tmp/bank_git/
        git clone https://github.com/sec4us-training/web-api-linux.git bank_api

        GIT_SSH_COMMAND="ssh -i {{ GITLAB_HOME }}/id_rsa_root -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" git clone "git@{{gitlab_host}}:sec4us/bank.git" /tmp/bank_git
        mkdir -p /tmp/bank_git/ || true
        rsync -a ./bank_api/bank/* /tmp/bank_git/

        cd /tmp/bank_git/
        find . -path "*/migrations/0*.py" ! -path "*/lib/*" -exec rm -rf {} \;

      ignore_errors: false
      become: yes
      when: not git_path.stat.exists

    - name: Creating a gitignore
      copy:
        dest: "/tmp/bank_git/.gitignore"
        content: |
          # Django #
          *.log
          *.pot
          *.pyc
          __pycache__
          db.sqlite3
          media
          .idea
          *.*~
          *.sqlite3
          .DS_Store
          ._.DS_Store
          **/.DS_Store
          **/._.DS_Store
          
          __MACOSX
          **/__MACOSX

          # Backup files #
          *.bak
          *.zip

          # Migrations file
          **/migrations/*.py

          #reinclude
          !**/migrations/__init__.py

          # If you are using PyCharm #
          .idea/**/workspace.xml
          .idea/**/tasks.xml
          .idea/dictionaries
          .idea/**/dataSources/
          .idea/**/dataSources.ids
          .idea/**/dataSources.xml
          .idea/**/dataSources.local.xml
          .idea/**/sqlDataSources.xml
          .idea/**/dynamic.xml
          .idea/**/uiDesigner.xml
          .idea/**/gradle.xml
          .idea/**/libraries
          *.iws /out/

          # Python #
          *.py[cod]
          *$py.class

          # Distribution / packaging
          .Python build/
          develop-eggs/
          dist/
          downloads/
          eggs/
          .eggs/
          lib/
          lib64/
          parts/
          sdist/
          var/
          wheels/
          *.egg-info/
          .installed.cfg
          *.egg
          *.manifest
          *.spec

          # Installer logs
          pip-log.txt
          pip-delete-this-directory.txt

          # Unit test / coverage reports
          htmlcov/
          .tox/
          .coverage
          .coverage.*
          .cache
          .pytest_cache/
          nosetests.xml
          coverage.xml
          *.cover
          .hypothesis/

          # Jupyter Notebook
          .ipynb_checkpoints

          # pyenv
          .python-version

          # celery
          celerybeat-schedule.*

          # SageMath parsed files
          *.sage.py

          # Environments
          .env
          .venv
          env/
          venv/
          ENV/
          env.bak/
          venv.bak/

          # mkdocs documentation
          /site

          # mypy
          .mypy_cache/

          # Sublime Text #
          *.tmlanguage.cache
          *.tmPreferences.cache
          *.stTheme.cache
          *.sublime-workspace
          *.sublime-project

          # sftp configuration file
          sftp-config.json

          # Package control specific files Package
          Control.last-run
          Control.ca-list
          Control.ca-bundle
          Control.system-ca-bundle
          GitHub.sublime-settings

          # Visual Studio Code #
          .vscode/*
          !.vscode/settings.json
          !.vscode/tasks.json
          !.vscode/launch.json
          !.vscode/extensions.json
          .history

    - name: Creatting Bank config file
      copy:
        dest: "/tmp/bank_git/config.ini"
        force: yes
        content: |
          [GENERAL]
          debug=True

          [DATABASE]
          user = bank
          passwd = 123456
          db = bank
          host = bankdb
          port = 3306
          charset = utf8
          autocommit = False

    - name: Creating sonar-project.properties
      copy:
        dest: "/tmp/bank_git/sonar-project.properties"
        force: yes
        content: |
          sonar.projectKey=sec4us-bank
          sonar.projectName=Sec4US Bank
          sonar.projectVersion=1.0
          sonar.sources=.
          sonar.exclusions=**/migrations/**,**/__pycache__/**,**/*.pyc,**/.venv/**,**/venv/**
          sonar.sourceEncoding=UTF-8
          sonar.python.version=3

    - name: Creating Jenkinsfile
      ansible.builtin.copy:
        dest: "/tmp/bank_git/Jenkinsfile"
        force: true
        content: |
          {% raw %}pipeline {
            agent any

            stages {
              stage('Checkout') {
                steps {
                  checkout([
                    $class: 'GitSCM',
                    branches: [[name: '*/main']],
                    userRemoteConfigs: [[
                      url: 'https://{% endraw %}{{ gitlab_host }}{% raw %}/sec4us/bank.git',
                      credentialsId: '{% endraw %}{{credentials_id}}{% raw %}'
                    ]]
                  ])
                }
              }

              stage('SonarQube Analysis') {
                steps {
                  script {
                    def scannerHome = tool 'SonarScanner'
                    // Nome do servidor configurado em "Manage Jenkins > System > SonarQube servers"
                    withSonarQubeEnv('sonar-labs') {
                      sh "${scannerHome}/bin/sonar-scanner"
                    }
                  }
                }
                post {
                  always {
                    archiveArtifacts artifacts: '.scannerwork/report-task.txt', allowEmptyArchive: true
                  }
                }
              }

              stage('Quality Gate') {
                steps {
                  script {
                    timeout(time: 2, unit: 'MINUTES') {
                      def qg = waitForQualityGate(abortPipeline: false)
                      if (qg.status != 'OK') {
                        error "Quality Gate failed: ${qg.status}"
                      }
                    }
                  }
                }
              }

              stage('Build com segredos do Vault') {
                steps {
                  script {
                    def secrets = [[
                      path: 'secret/bank',
                      engineVersion: 1,
                      secretValues: [
                        [envVar: 'DB_USER', vaultKey: 'db_user'],
                        [envVar: 'DB_PASS', vaultKey: 'db_pass']
                      ]
                    ]]

                    def configuration = [
                      vaultUrl: 'https://{% endraw %}{{ vault_host }}{% raw %}',
                      vaultCredentialId: 'vault',
                      engineVersion: 1
                    ]

                    withVault([configuration: configuration, vaultSecrets: secrets]) {
                      sh '''
                        set +x
                        echo "Rodando build..."
                        echo "DB_USER: ${DB_USER}"
                        echo "DB_PASS: ${DB_PASS}"
                      '''
                    }
                  }
                }
              }
            }

            post {
              always {
                echo "final steps"
                // Recomendo manter limpeza
                // cleanWs(deleteDirs: true, notFailBuild: true, disableDeferredWipeout: true)
              }
            }
          }{% endraw %}


    - name: GitLab | Commit
      shell: |
        cd /tmp/bank_git/
        git branch -m main
        git add .
        git commit -m "Deploy"
        GIT_SSH_COMMAND="ssh -i {{ GITLAB_HOME }}/id_rsa_root -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" git push origin main
      ignore_errors: false

    - include_tasks: 'vault_token_jenkins.yml'
    - include_tasks: 'vault_token_sonar.yml'

    # ------------------------------------------------------------------
    # Sonar | create project + project analysis token + store in Vault
    # (Server SonarQube, SonarScanner tool e webhook são configurados
    #  globalmente em install_jenkins.yml)
    # ------------------------------------------------------------------
    - name: Sonar | Check if project "{{ sonar_project_key }}" already exists
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/projects/search?projects={{ sonar_project_key }}"
        method: GET
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
        validate_certs: false
      register: sonar_search

    - name: Sonar | Create project "{{ sonar_project_name }}"
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/projects/create"
        method: POST
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          name: "{{ sonar_project_name }}"
          project: "{{ sonar_project_key }}"
          visibility: "{{ sonar_project_visibility }}"
        status_code: [200]
        validate_certs: false
      when: (sonar_search.json.components | length) == 0

    - name: Sonar | Revoke previous project token (if any)
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/user_tokens/revoke"
        method: POST
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          login: "{{ sonar_admin_username }}"
          name: "{{ sonar_project_token_name }}"
        status_code: [200, 204, 400, 404]
        validate_certs: false

    - name: Sonar | Generate project analysis token
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/user_tokens/generate"
        method: POST
        user: "{{ sonar_admin_username }}"
        password: "{{ sonar_admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          name: "{{ sonar_project_token_name }}"
          type: "PROJECT_ANALYSIS_TOKEN"
          projectKey: "{{ sonar_project_key }}"
        status_code: [200]
        validate_certs: false
      register: sonar_project_token_resp
      no_log: true

    - name: Sonar | Set fact with project token
      ansible.builtin.set_fact:
        sonar_project_token: "{{ sonar_project_token_resp.json.token }}"
      no_log: true

    - name: Sonar | Fail if project token was not returned
      ansible.builtin.fail:
        msg: "SonarQube did not return a project analysis token."
      when: (sonar_project_token | default('') | length) == 0

    - name: Sonar | Store project token in Vault (secret/sonarqube/projects/{{ sonar_project_key }})
      ansible.builtin.uri:
        url: "https://{{ vault_host }}/v1/secret/sonarqube/projects/{{ sonar_project_key }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          url: "https://{{ sonar_host }}"
          project_key: "{{ sonar_project_key }}"
          project_name: "{{ sonar_project_name }}"
          token_name: "{{ sonar_project_token_name }}"
          token: "{{ sonar_project_token }}"
        validate_certs: false
        status_code: [200, 204]
      no_log: true

    #Create Bank CI/CD
    - name: Jenkins | Set fact (Bank CI/CD)
      ansible.builtin.set_fact:
        job_name: "bank-pipeline"
        job_description: "Pipeline job pulling Jenkinsfile from SCM"
        repo_url: "https://{{gitlab_host}}/sec4us/bank.git"

    - include_tasks: 'jenkins_pipeline.yml'

    - name: GitLab | List existing projects
      uri:
        url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects"
        method: "GET"
        headers:
          PRIVATE-TOKEN: "{{ gitlab_admin_token }}"
        validate_certs: false
        return_content: true
        status_code: [200, 502, 503, 504]
      register: projects_list_output
      until: projects_list_output.status == 200
      retries: 30
      delay: 10

    - name: "Check if project is already exists"
      set_fact:
        project_exists: "{{ gitlab_project_group + '/' + gitlab_project_name in\
          (projects_list_output.json | map(attribute='path_with_namespace')  | list) }}"

    - name: GitLab | Get project ID
      set_fact:
        gitlab_project_id: "{{ item.id }}"
      loop: "{{ projects_list_output.json }}"
      when:
        - project_exists
        - item.path_with_namespace == gitlab_project_group + '/' + gitlab_project_name

    - name: GitLab | Create CI/CD variable (project level)
      ansible.builtin.uri:
        url: "https://{{ gitlab_host }}/api/{{ gitlab_api_version }}/projects/{{ gitlab_project_id }}/variables"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_admin_token }}"
        body_format: form-urlencoded
        body:
          key: "FAKE_SECRET_TOKEN"
          value: "inY9Ts0MThkdDptliBlLsDhxg39AYsMric4tUSvmHT"
          variable_type: "env_var"
          environment_scope: "*"
          protected: "true"
          masked: "true"
          raw: "true"
          description: "DevSecOps fake secret token"
        status_code: [201, 400, 409, 502, 503, 504]
        validate_certs: false
      register: create_var
      until: create_var.status in [201, 400, 409]
      retries: 30
      delay: 10
      no_log: true
