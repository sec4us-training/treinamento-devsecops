---
- hosts: all
  become: yes
  vars:
    ansible_python_interpreter: "/usr/bin/python3"
    CERT_HOME: /u01/www_cert

  vars_files:
    - vars.yml

  tasks:

    - name: Base | Set a hostname
      ansible.builtin.hostname:
        name: devsecops

    - name: Base | Force hostname update
      ignore_errors: true
      shell: |
        hostname devsecops
        hostnamectl set-hostname devsecops

    - name: Base | Set hosts
      shell: |
        echo "127.0.0.1    $(hostname)" >> /etc/hosts
        echo "127.0.0.1    {{ sonar_host }}" >> /etc/hosts
        echo "127.0.0.1    {{ web01_host }}" >> /etc/hosts
        echo "127.0.0.1    {{ vault_host }}" >> /etc/hosts
        echo "127.0.0.1    {{ gitlab_host }}" >> /etc/hosts
        echo "127.0.0.1    {{ artifactory_host }}" >> /etc/hosts
        echo "127.0.0.1    {{ jenkins_host }}" >> /etc/hosts
        echo "127.0.0.1    {{ registry_host }}" >> /etc/hosts
        
    - name: Base | Make sure we have a 'sec4us' group
      group:
        name: sec4us
        state: present

    - name: Base | Allow 'sec4us' group to have passwordless sudo
      lineinfile:
        dest: /etc/sudoers
        state: present
        regexp: '^%sec4us'
        line: '%sec4us ALL=(ALL) NOPASSWD: ALL'
        validate: 'visudo -cf %s'

    - name: Base | Add sudoers users to sec4us group
      user:
        name: "{{ local_username }}"
        groups: sec4us
        append: yes
        state: present
        createhome: yes
        shell: /bin/bash

    - name: Base | Set up authorized keys for the user
      authorized_key:
        user: "{{ local_username }}"
        key: "{{item}}"
      with_file:
        - ssh_key.pub

    - name: Base | Get local user
      set_fact:
        home_path: "{{ lookup('env', 'HOME') }}"
      delegate_to: localhost

    - name: Base | Check if local id_rsa.pub exists
      stat:
        path: "{{home_path}}/.ssh/id_rsa.pub"
      register: pub_stats
      delegate_to: localhost
      become: no

    - name: Base | Set up local id_rsa.pub as authorized keys for the user
      authorized_key:
        user: "{{ local_username }}"
        key: "{{ lookup('file', pub_stats.stat.path)}}"
      when: pub_stats.stat.exists
      ignore_errors: true

    - include_tasks: 'user_details.yml'

    - name: Base | Remove CDROM line from APT source list
      lineinfile:
        line: #Removed
        regexp: ^deb.*/cdrom.*
        path: /etc/apt/sources.list
        state: absent

    - name: Base | Update apt package lists
      ansible.builtin.apt:
        update_cache: true

    - name: Base | Install deploy-specific dependencies
      apt:
        pkg:
          - libwacom-common
          - python3-apt
      register: deploy_deps_install
      retries: 3
      delay: 5
      until: deploy_deps_install is succeeded

    - name: Base | Update all packages to their latest version
      ignore_errors: yes
      apt:
        name: "*"
        state: latest

    - name: Extending Volume
      ignore_errors: yes
      shell: |
        set +e

        # 0) Garante 'growpart' (vem em cloud-guest-utils, ja presente
        #    nos AMIs cloud por padrao, mas instala se faltar).
        command -v growpart >/dev/null 2>&1 || \
          DEBIAN_FRONTEND=noninteractive apt-get install -y cloud-guest-utils

        # 1) Layout antes (diagnostico)
        echo "--- lsblk (antes) ---"
        lsblk -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINT
        echo "--- pvs (antes) ---"
        pvs 2>/dev/null

        # 2) Para cada PV LVM, cresce a particao do host e o proprio PV.
        #    Necessario quando o disco subjacente (EBS, etc) foi
        #    aumentado mas a particao/PV ainda nao viu o espaco.
        for pv in $(pvs --noheadings -o pv_name 2>/dev/null | tr -d ' '); do
          [ -z "$pv" ] && continue
          disk=$(lsblk -no PKNAME "$pv" 2>/dev/null | head -1)
          # part_num = digitos finais (cobre /dev/sdaN e /dev/nvme0n1pN)
          part_num=$(echo "$pv" | sed -E 's|.*[^0-9]([0-9]+)$|\1|')
          if [ -n "$disk" ] && [ -n "$part_num" ]; then
            echo "+ growpart /dev/$disk $part_num"
            growpart "/dev/$disk" "$part_num"   # retorna != 0 se NOCHANGE
            echo "+ pvresize $pv"
            pvresize "$pv"
          fi
        done

        # 3) Estende o LV e cresce o filesystem (logica original)
        lv_path=$(lvdisplay | grep -i 'LV Path' | grep -oE '/dev.*')
        if [ -n "$lv_path" ]; then
          echo "+ lvextend -l+100%FREE $lv_path"
          lvextend -l+100%FREE "$lv_path"
          echo "+ resize2fs $lv_path"
          resize2fs "$lv_path"
        fi

        # 4) Layout depois
        echo "--- lsblk (depois) ---"
        lsblk -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINT

    - name: Base | Install a list of packages
      apt:
        pkg:
        - build-essential
        - curl
        - openssl
        - libmariadb-dev-compat
        - libmariadb-dev
        - libssl-dev
        - ca-certificates
        - libssl-dev 
        - libffi-dev
        - mariadb-client
        - mariadb-server
        - ntp
        - net-tools
        - ntpdate 
        - sqlite3 
        - certbot 
        - fail2ban 
        - p7zip-full
        - easy-rsa
        - perl
        - libsasl2-2
        - libsasl2-modules
        - unzip
        - xz-utils
        - xorg
        - apache2-utils
        - software-properties-common
        - openjdk-8-jre
        - openjdk-8-jdk
        - openjdk-17-jre
        - openjdk-17-jdk
        - unzip
        - zip
        - firefox
        - terminator
        - jq
        - default-jre 
        - default-jdk 
        - libmagic-dev 
        - git
      register: deploy_apt_install
      retries: 3
      delay: 5
      until: deploy_apt_install is succeeded

    - name: Base | Change default user password
      shell: echo {{ local_username }}:{{ default_password }} | chpasswd
      ignore_errors: yes
      become: yes

    - name: Base | Configuring MOTD
      copy:
        dest: "/etc/motd"
        owner: root
        group: root
        mode: 0644
        force: yes
        content: |
          .
           _____             ___ _   _ _____
          /  ___|           /   | | | /  ___|
          \ `--.  ___  ___ / /| | | | \ `--.
           `--. \/ _ \/ __/ /_| | | | |`--. \
          /\__/ /  __/ (__\___  | |_| /\__/ /
          \____/ \___|\___|   |_/\___/\____/

          Treinamento: Treinamento: DevSecOps
          Servidor v 1.0

          Copyright © Sec4US® - Todos os direitos reservados. Nenhuma parte dos materiais disponibilizadas, incluindo este servidor, suas aplicações e seu código fonte, podem ser copiadas, publicadas, compartilhadas, redistribuídas, sublicenciadas, transmitidas, alteradas, comercializadas ou utilizadas para trabalhos sem a autorização por escrito da Sec4US

          Sistema disponibilizado para:
          {{ user_text }}

          _____

    - name: Base | Clear other MOTD
      shell: rm -rf /etc/update-motd.d/*
      ignore_errors: yes
      become: yes

    - name: Base | Configuring multipathconf
      copy:
        dest: "/etc/multipath.conf"
        content: |
          defaults {
              user_friendly_names yes
          }
          blacklist {
              devnode "^(ram|raw|loop|fd|md|dm-|sr|scd|st|sda)[0-9]*"
          }
        force: yes
        owner: root
        group: root
        mode: 0600
      register: multipathconf

    - name: Base | Restart multipathd
      ignore_errors: yes
      service:
        name: multipathd
        state: restarted
      when:
        - multipathconf.changed

    - name: Base | Ensure a locale en_US exists
      community.general.locale_gen:
        name: en_US
        state: present

    - name: Base | Ensure a locale en_US.UTF-8 exists
      community.general.locale_gen:
        name: en_US.UTF-8
        state: present

    - name: Base | Ensure a locale pt_BR exists
      community.general.locale_gen:
        name: pt_BR
        state: present

    - name: Base | Ensure a locale pt_BR.UTF-8 exists
      community.general.locale_gen:
        name: pt_BR.UTF-8
        state: present

    - name: Base | Set en_US.UTF-8 as default locale
      shell: |
        echo 'LANG="en_US.UTF-8"' > /etc/default/locale
        echo 'LANGUAGE="en_US:en"' >> /etc/default/locale
        echo 'LC_ALL="en_US.UTF-8"' >> /etc/default/locale

    - name: Base | Set dateext at logrotate
      command: echo "dateext" >> /etc/logrotate.conf

    - name: Base | Set timezone at logrotate
      command: timedatectl set-timezone America/Sao_Paulo

    - name: Base | Generate root's SSH key
      user:
        name: "root"
        generate_ssh_key: yes
        ssh_key_type: rsa
        ssh_key_bits: 4096
        ssh_key_file: .ssh/id_rsa
        force: no

    # Quem decide é o `ssh_password_auth` do vars.yml: `false` (padrão, e o que
    # vale no pipeline) deixa só chave; o `deploy.sh` passa `true` como
    # extra-var, porque lá o servidor é do próprio aluno.
    - name: Base | Autenticação por senha no sshd_config
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*PasswordAuthentication\s'
        line: "PasswordAuthentication {{ 'yes' if ssh_password_auth | bool else 'no' }}"

    # A linha acima, sozinha, NÃO decide nada nesta imagem.
    #
    # O /etc/ssh/sshd_config traz `Include /etc/ssh/sshd_config.d/*.conf` já na
    # linha 12, e a imagem do Ubuntu vem com um `50-cloud-init.conf` dizendo
    # `PasswordAuthentication yes`. No sshd vale o PRIMEIRO valor obtido, então o
    # drop-in — incluído lá no topo — vence a linha do arquivo principal. Nesta
    # VM o `sshd -T` respondia `passwordauthentication yes` com o
    # `PasswordAuthentication no` escrito no arquivo.
    #
    # A correção é entrar no mesmo diretório com um nome que ordene ANTES
    # (00 < 50): aí o primeiro valor passa a ser este. O drop-in é escrito nos
    # DOIS casos, de propósito — assim o resultado é o que este playbook diz, e
    # não o que a imagem trouxe.
    - name: Base | Drop-in do SSH (vence o do cloud-init)
      copy:
        dest: /etc/ssh/sshd_config.d/00-lab-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Sec4US — este arquivo decide a autenticação do SSH.
          # Ordena antes do 50-cloud-init.conf de propósito: no sshd o primeiro
          # valor obtido é o que vale.
          PasswordAuthentication {{ 'yes' if ssh_password_auth | bool else 'no' }}
          # O par do de cima: sem isto o PAM continua pedindo senha pelo
          # keyboard-interactive, e desligar só o PasswordAuthentication não
          # vale nada.
          KbdInteractiveAuthentication {{ 'yes' if ssh_password_auth | bool else 'no' }}
          PermitEmptyPasswords no
          PubkeyAuthentication yes
          PermitRootLogin {{ 'yes' if ssh_password_auth | bool else 'prohibit-password' }}

    # Antes de reiniciar: configuração inválida aqui deixaria o sshd fora do ar,
    # e o deploy inteiro fala com esta máquina por SSH.
    - name: Base | Validar a configuração do sshd
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Base | Restart SSH service
      service:
        name: sshd
        state: restarted

    # `sshd -T` mostra o que o daemon REALMENTE aplica, com os includes já
    # resolvidos — é o único jeito de saber que a senha caiu mesmo.
    - name: Base | Ler a configuração efetiva do sshd
      ansible.builtin.shell: |
        sshd -T | grep -E '^(passwordauthentication|kbdinteractiveauthentication|permitemptypasswords|pubkeyauthentication|permitrootlogin) '
      register: sshd_effective
      changed_when: false

    # O que foi pedido tem que ser o que ficou valendo — nos dois sentidos. Um
    # `sshd -T` dizendo o contrário significa outro arquivo em
    # /etc/ssh/sshd_config.d/ ordenando antes do nosso.
    - name: Base | Conferir a autenticação do SSH
      ansible.builtin.assert:
        that:
          - "'passwordauthentication ' ~ ('yes' if ssh_password_auth | bool else 'no') in sshd_effective.stdout"
          - "'kbdinteractiveauthentication ' ~ ('yes' if ssh_password_auth | bool else 'no') in sshd_effective.stdout"
          - "'permitemptypasswords no' in sshd_effective.stdout"
          - "'pubkeyauthentication yes' in sshd_effective.stdout"
        success_msg: >-
          SSH {{ 'aceita senha e chave (ssh_password_auth=true)'
                 if ssh_password_auth | bool else 'aceita apenas chave' }}.
        fail_msg: >-
          O sshd não ficou como o pedido (ssh_password_auth={{ ssh_password_auth }}).
          O que ele aplica: {{ sshd_effective.stdout_lines | join(' | ') }}.
          Procure outro arquivo em /etc/ssh/sshd_config.d/ que ordene antes do
          00-lab-hardening.conf.

    - name: Base | Disable auto update
      copy:
        dest: "/etc/apt/apt.conf.d/20auto-upgrades"
        owner: root
        group: root
        mode: 0644
        force: yes
        content: |
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Download-Upgradeable-Packages "0";
          APT::Periodic::AutocleanInterval "0";
          APT::Periodic::Unattended-Upgrade "0";
    
    - name: Base | Go 1.24.12
      shell: |
        cd /opt
        wget https://go.dev/dl/go1.24.12.linux-amd64.tar.gz
        rm -rf /usr/local/go
        tar -C /usr/local -xzf go1.24.12.linux-amd64.tar.gz
        rm -rf /usr/bin/go
        ln -s /usr/local/go/bin/go /usr/bin/go
        exit 0
      args:
        executable: /bin/bash
      ignore_errors: yes

    - include_tasks: 'user_details.yml'

    - include_tasks: 'setup_python.yml'
    - include_tasks: 'setup_nginx.yml'

    - include_tasks: 'project_clone.yml'

    - name: Base | Install a list of packages
      apt:
        pkg:
        - squid

    - name: Base | Configuring SQUID
      copy:
        dest: "/etc/squid/squid.conf"
        owner: root
        group: root
        mode: 0644
        force: yes
        content: |
          cache deny all
          acl localnet src 0.0.0.1-0.255.255.255    # RFC 1122 "this" network (LAN)
          acl localnet src 10.0.0.0/8       # RFC 1918 local private network (LAN)
          acl localnet src 100.64.0.0/10        # RFC 6598 shared address space (CGN)
          acl localnet src 169.254.0.0/16   # RFC 3927 link-local (directly plugged) machines
          acl localnet src 172.16.0.0/12        # RFC 1918 local private network (LAN)
          acl localnet src 192.168.0.0/16       # RFC 1918 local private network (LAN)
          acl localnet src fc00::/7         # RFC 4193 local private network range
          acl localnet src fe80::/10        # RFC 4291 link-local (directly plugged) machines
          acl SSL_ports port 443
          acl Safe_ports port 80        # http
          acl Safe_ports port 21        # ftp
          acl Safe_ports port 443       # https
          acl Safe_ports port 70        # gopher
          acl Safe_ports port 210       # wais
          acl Safe_ports port 1025-65535    # unregistered ports
          acl Safe_ports port 280       # http-mgmt
          acl Safe_ports port 488       # gss-http
          acl Safe_ports port 591       # filemaker
          acl Safe_ports port 777       # multiling http
          acl CONNECT method CONNECT
          http_access deny !Safe_ports
          http_access deny CONNECT !SSL_ports
          http_access deny localhost manager
          http_access deny manager

          # --- API do Docker: nunca atraves do proxy -------------------------
          # Sem isto, `http://<qualquer>.sec4us.com.br:2375/` passa pelo
          # `allow devsecops` (o dstdomain casa e a 2375 cai no Safe_ports
          # 1025-65535) e entrega a API do daemon -- root na VM -- mesmo com a
          # porta fechada no firewall. Vale para GET e para CONNECT.
          acl docker_api port 2375 2376
          http_access deny docker_api

          # --- SC-Connecting-IP ---------------------------------------------
          # Quem escreve o header e o Squid, com o IP real do cliente (%>a).
          # O `deny all` descarta o que o cliente mandar, entao nao da para
          # forjar a origem; o Nginx confia no header so vindo de 127.0.0.1.
          request_header_access SC-Connecting-IP deny all
          request_header_add SC-Connecting-IP "%>a" all
          include /etc/squid/conf.d/*

          #Auth
          #auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
          #auth_param basic realm DevSecOps

          # ACL
          #acl authenticated proxy_auth REQUIRED
          acl devsecops dstdomain .sec4us.com.br
          http_access allow devsecops
          http_access deny all

          http_port {{ squid_port }}
          coredump_dir /var/spool/squid
          refresh_pattern ^ftp:     1440    20% 10080
          refresh_pattern ^gopher:  1440    0%  1440
          refresh_pattern -i (/cgi-bin/|\?) 0   0%  0
          refresh_pattern .     0   20% 4320
          visible_hostname devsecops.sec4us.com.br

    - name: Base | Change squid user password
      shell: htpasswd -bB -c /etc/squid/passwords {{ local_username }} {{ default_password }}
      ignore_errors: no
      become: yes

    - name: Base | Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Base | Enable service squid and ensure it is not masked
      ansible.builtin.systemd:
        name: squid
        enabled: yes
        masked: no

    - name: Base | Restarting squid
      service:
        name: squid
        state: restarted

