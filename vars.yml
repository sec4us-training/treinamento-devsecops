default_username: "ubuntu"
default_password: "sec4ussecops"
user_text: ""
local_username: secops
vault_host: vault.labs.sec4us.com.br
gitlab_host: gitlab.labs.sec4us.com.br
artifactory_host: artifactory.labs.sec4us.com.br
jenkins_host: jenkins.labs.sec4us.com.br
sonar_host: sonar.labs.sec4us.com.br
web01_host: www.labs.sec4us.com.br
registry_host: registry.labs.sec4us.com.br

jfrog_repo_key: "sec4us"
vault_home: /u01/vault
gitlab_external_url: "https://{{ gitlab_host }}"
gitlab_api_version: v4
pip_extra_args: "--break-system-packages"

# Informacoes Jenkins Job
repo_branch: "*/main"
script_path: "Jenkinsfile"
credentials_id: "gitlab-gitscm"

# Info Gitlab
GITLAB_HOME: /u01/gitlab

# --- Rede / firewall ---------------------------------------------------------
# Porta do Squid. Fonte unica: o squid.conf (setup_base.yml) e a regra de
# firewall (setup_firewall.yml) leem daqui.
squid_port: 48284

# A interface externa (a que fala com a rede dos alunos) NÃO fica fixada aqui: o
# setup_firewall.yml a descobre pela rota default da própria máquina. O nome muda
# com o hipervisor e com a imagem (ens192 no VMware, eth0, enp0s3...), e um nome
# errado seria pior do que nenhum — as regras da DOCKER-USER não casariam com
# nada e o bloqueio falharia EM ABERTO, sem erro nenhum.
#
# Para forçar uma interface (VM com mais de uma saída, por exemplo), passe
# `ext_if` como extra-var: elas vencem o fato descoberto no playbook.

# Portas TCP abertas para a rede externa. Todo o resto e bloqueado.
fw_allowed_tcp:
  - 22
  - 80
  - 443
  - "{{ squid_port }}"

# Faixa das redes internas do Docker: a unica origem autorizada a falar com a
# API do daemon (2375).
docker_net_cidr: 172.16.0.0/12
