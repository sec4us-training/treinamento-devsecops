---
# Rewrites /etc/nginx/conf.d/jenkins.conf so the vhost proxies the
# Upgrade/Connection headers required by inbound JNLP agents that talk
# to Jenkins over WebSocket (/wsagents/). Idempotent: same content +
# nginx reload on every run.
- hosts: all
  become: yes
  vars:
    ansible_python_interpreter: "/usr/bin/python3"

  vars_files:
    - vars.yml

  tasks:
    - name: Jenkins | Configuring NGINX (with WebSocket upgrade)
      copy:
        dest: "/etc/nginx/conf.d/jenkins.conf"
        owner: root
        group: root
        mode: 0644
        force: yes
        content: |
          server {
              listen        443 ssl;
              server_name {{ jenkins_host }};

              ssl_certificate      /etc/nginx/certs/ssl.cer;
              ssl_certificate_key  /etc/nginx/certs/ssl.key;

              root /dev/null;
              index index.html index.htm;
              try_files $uri $uri/ $uri/404 =404;

              location / {
                  proxy_http_version    1.1;
                  proxy_ssl_verify      off;
                  proxy_set_header      Host                $host;
                  proxy_set_header      X-Real-IP           $remote_addr;
                  proxy_set_header      X-Forwarded-For     $remote_addr;
                  proxy_set_header      X-Forwarded-Proto   $scheme;

                  # Required for inbound JNLP agents over WebSocket (/wsagents/)
                  proxy_set_header      Upgrade             $http_upgrade;
                  proxy_set_header      Connection          "upgrade";
                  proxy_read_timeout    86400;
                  proxy_send_timeout    86400;

                  proxy_pass http://127.0.0.1:8080;
              }
          }

    - name: Jenkins | Validate and reload nginx
      shell: nginx -t && nginx -s reload
