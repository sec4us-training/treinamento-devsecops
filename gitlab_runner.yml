---
- hosts: all
  become: yes
  vars:
    ansible_python_interpreter: "/usr/bin/python3"
    shell_runner_description: "shell-runner-devsecops"
    shell_runner_tags: "shell,linux,ci"

    docker_runner_description: "docker-runner-devsecops"
    docker_runner_tags: "docker,linux,dind"

    runner_locked: false
    runner_access_level: "not_protected"   # or "ref_protected" depending on your policy
    runner_home: "/u01/runner"

  vars_files:
    - vars.yml

  tasks:
    - include_tasks: 'user_details.yml'
    - include_tasks: 'vault_token.yml'
    - include_tasks: 'vault_token_gitlab.yml'

    - name: GitLab | Register shell runner (returns glrt token once)
      ansible.builtin.uri:
        url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/user/runners"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_admin_token }}"
        body_format: form-urlencoded
        body:
          runner_type: "instance_type"
          description: "{{ shell_runner_description }}"
          tag_list: "{{ shell_runner_tags }}"
          locked: "{{ runner_locked | ternary('true','false') }}"
          run_untagged: "true"
          access_level: "{{ runner_access_level }}"
        status_code: [201, 502, 503, 504]
        return_content: true
        validate_certs: false
      register: create_shell_runner
      until: create_shell_runner.status == 201
      retries: 30
      delay: 10
      no_log: true

    - name: GitLab | Set shell runner auth token fact
      ansible.builtin.set_fact:
        shell_runner_auth_token: "{{ create_shell_runner.json.token }}"
      no_log: true

    - name: GitLab | Register docker runner (returns glrt token once)
      ansible.builtin.uri:
        url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/user/runners"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_admin_token }}"
        body_format: form-urlencoded
        body:
          runner_type: "instance_type"
          description: "{{ docker_runner_description }}"
          tag_list: "{{ docker_runner_tags }}"
          locked: "{{ runner_locked | ternary('true','false') }}"
          run_untagged: "false"
          access_level: "{{ runner_access_level }}"
        status_code: [201, 502, 503, 504]
        return_content: true
        validate_certs: false
      register: create_docker_runner
      until: create_docker_runner.status == 201
      retries: 30
      delay: 10
      no_log: true

    - name: GitLab | Set docker runner auth token fact
      ansible.builtin.set_fact:
        docker_runner_auth_token: "{{ create_docker_runner.json.token }}"
      no_log: true
    
    - name: GitLab | Stop service, if exists
      shell: |
        cd {{ runner_home }}
        docker compose down -v
      ignore_errors: true

    - name: GitLab | Remove directories
      file:
        path: "{{ item.path }}"
        state: absent
      with_items:
          - { path: "{{ runner_home }}/ssh_keys" } 
          - { path: "{{ runner_home }}" } 
          
    - name: GitLab | Create directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "root"
        group: "root"
        mode: 0777
      with_items:
          - { path: "{{ runner_home }}" }  
          - { path: "{{ runner_home }}/ssh_keys" }  

    - name: GitLab | Find root SSH keys
      ansible.builtin.find:
        paths: /root/.ssh
        patterns: 'id_rsa*'
      register: gitlab_root_ssh_keys

    - name: GitLab | Copy SSH keys
      copy:
        src: "{{ item.path }}"
        remote_src: true
        dest: "{{ runner_home }}/ssh_keys/"
        owner: "root"
        group: "root"
      loop: "{{ gitlab_root_ssh_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: GitLab | Copy CA root cert
      copy:
        src: "/etc/nginx/certs/root-ca.pem"
        dest: "{{ runner_home }}/root-ca.crt"
        remote_src: true
        owner: "root"
        group: "root"

    - name: GitLab | Creating runner config file
      copy:
        dest: "{{ runner_home }}/config.toml"
        content: |
          # Global runner settings
          concurrent = 4
          check_interval = 0
          shutdown_timeout = 0

          log_level = "info"
          log_format = "runner"

          [session_server]
            session_timeout = 1800

          # =========================
          # Runner 1 - shell executor (mantido)
          # =========================
          [[runners]]
            name = "shell-runner-sec4us"
            url = "https://{{gitlab_host}}"
            token = "{{shell_runner_auth_token}}"
            executor = "shell"
            tags = ["shell", "linux", "ci"]
            run_untagged = true
            locked = false
            access_level = "not_protected"
            output_limit = 40960
            environment = [
              "TZ=America/Sao_Paulo"
            ]

            [runners.cache]
              Type = "filesystem"
              Path = "/srv/gitlab-runner/cache"
              Shared = true

          # =========================
          # Runner 2 - docker executor (com DinD)
          # =========================
          #  - privileged = true: exigido para 'services: docker:dind' funcionar.
          #  - docker.sock montado: permite jobs interagirem com o engine do host
          #    (DooD opcional). DinD via service ja funciona sem isso.
          #  - extra_hosts: replicam o /etc/hosts do host pros containers de job
          #    poderem resolver os servicos internos do lab.
          [[runners]]
            name = "docker-runner-sec4us"
            url = "https://{{gitlab_host}}"
            token = "{{docker_runner_auth_token}}"
            executor = "docker"
            tags = ["docker", "linux", "dind"]
            run_untagged = false
            locked = false
            access_level = "not_protected"
            output_limit = 40960
            environment = [
              "TZ=America/Sao_Paulo"
            ]

            [runners.docker]
              image = "ubuntu:jammy"
              privileged = true
              pull_policy = ["if-not-present"]
              volumes = [
                "/cache",
                "/var/run/docker.sock:/var/run/docker.sock"
              ]
              extra_hosts = [
                "host.docker.internal:host-gateway",
                "{{vault_host}}:host-gateway",
                "{{gitlab_host}}:host-gateway",
                "{{artifactory_host}}:host-gateway",
                "{{jenkins_host}}:host-gateway",
                "{{sonar_host}}:host-gateway",
                "{{web01_host}}:host-gateway",
                "{{registry_host}}:host-gateway"
              ]

            [runners.cache]
              Type = "filesystem"
              Path = "/srv/gitlab-runner/cache"
              Shared = true

          # =========================
          # Metrics & monitoring (optional)
          # =========================
          [metrics]
            listen_address = "0.0.0.0:9252"



    - name: GitLab | Creating Dockerfile
      copy:
        dest: "{{ runner_home }}/Dockerfile"
        content: |
          {% raw %}FROM gitlab/gitlab-runner:latest

          USER root

          ENV DEBIAN_FRONTEND=noninteractive
          ENV CA_CERTIFICATES_PATH=/etc/gitlab-runner/certs/
          
          RUN mkdir -p /root/.ssh/ || true
          COPY ssh_keys/id_rsa* /root/.ssh/
          COPY root-ca.crt /etc/gitlab-runner/certs/ca.crt
          COPY root-ca.crt /usr/local/share/ca-certificates/root-ca.crt
          RUN update-ca-certificates

          RUN apt update && \
            apt install -y \
            ca-certificates \
            gnupg \
            wget \
            curl \
            rsync \
            jq \
            zip \
            lsb-release
          
          RUN install -m 0755 -d /etc/apt/keyrings && \
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg && \
            chmod a+r /etc/apt/keyrings/docker.gpg && \
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null && \
            apt update && \
            apt install -y docker-ce-cli

          USER root
          {% endraw %}

    - name: GitLab | Build docker image
      shell: |
        cd {{ runner_home }}
        docker build -t registry.labs.sec4us.com.br/ci/linux_runner:lts .

    - name: GitLab | Registry docker image
      shell: |
        cd {{ runner_home }}
        docker push registry.labs.sec4us.com.br/ci/linux_runner:lts

    - name: GitLab | Creating docker-compose.yml
      copy:
        dest: "{{ runner_home }}/docker-compose.yml"
        content: |
          services:
            gitlab-runner:
              image: registry.labs.sec4us.com.br/ci/linux_runner:lts
              container_name: gitlab-runner
              restart: always

              # Permite rodar builds que usam docker no host via /var/run/docker.sock
              user: "0:0"

              extra_hosts:
                - "{{vault_host}}:host-gateway"
                - "{{gitlab_host}}:host-gateway"
                - "{{artifactory_host}}:host-gateway"
                - "{{jenkins_host}}:host-gateway"
                - "{{sonar_host}}:host-gateway"
                - "{{web01_host}}:host-gateway"
                - "{{registry_host}}:host-gateway"

              ports:
                - "9252:9252"

              environment:
                - TZ=America/Sao_Paulo

              volumes:
                - /etc/nginx/certs/root-ca.pem:/usr/local/share/ca-certificates/root-ca.crt:ro
                - {{ runner_home }}/config.toml:/etc/gitlab-runner/config.toml:ro

                # Acesso ao Docker do host (Docker-outside-of-Docker)
                - /var/run/docker.sock:/var/run/docker.sock

    - name: GitLab | Start service
      shell: |
        cd {{ runner_home }}
        docker compose up -d

    - name: GitLab | Wait for runner container to be running
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' gitlab-runner
      register: runner_running
      retries: 60
      delay: 10
      until: runner_running.stdout == "true"
      changed_when: false


