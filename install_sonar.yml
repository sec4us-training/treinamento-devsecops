---
- hosts: all
  become: yes
  vars:
    ansible_python_interpreter: "/usr/bin/python3"
    SONAR_HOME: /u01/sonar
    sonar_admin_user: "admin"
    sonar_admin_old_password: "admin"

  vars_files:
    - vars.yml

  tasks:
    - include_tasks: 'user_details.yml'
    - include_tasks: 'vault_token.yml'

    - name: Sonar | Configuring NGINX
      copy:
        dest: "/etc/nginx/conf.d/sonar.conf"
        owner: root
        group: root
        mode: 0644
        force: yes
        content: |
          server {
              listen        443 ssl;
              server_name {{ sonar_host }};

              ssl_certificate      /etc/nginx/certs/ssl.cer;
              ssl_certificate_key  /etc/nginx/certs/ssl.key;

              root /dev/null;
              index index.html index.htm;
              try_files $uri $uri/ $uri/404 =404;

              client_max_body_size 100000M;

              location / {
                  proxy_http_version    1.1;
                  proxy_ssl_verify      off;
                  proxy_set_header      Host                $host;
                  proxy_set_header      X-Real-IP           $remote_addr;
                  proxy_set_header      X-Forwarded-For     $remote_addr;
                  proxy_set_header      X-Forwarded-Proto   $scheme;
                  proxy_pass http://127.0.0.1:9000;
              }
          
          }

    - name: Sonar | Reload nginx config
      shell: |
        nginx -s reload

    - name: Sonar | Create directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "root"
        group: "root"
        mode: 0777
      with_items:
          - { path: "{{ SONAR_HOME }}" }
          - { path: "{{ SONAR_HOME }}/postgresql" }
          - { path: "{{ SONAR_HOME }}/postgresql/data" }
          - { path: "{{ SONAR_HOME }}/sonarqube" }
          - { path: "{{ SONAR_HOME }}/sonarqube/data" }
          - { path: "{{ SONAR_HOME }}/sonarqube/extensions" }
          - { path: "{{ SONAR_HOME }}/sonarqube/logs" }

    - name: Sonar | Copy CA root cert
      copy:
        src: "/etc/nginx/certs/root-ca.pem"
        dest: "{{ SONAR_HOME }}/root-ca.crt"
        owner: "root"
        group: "root"

    - name: Sonar | Creating Dockerfile
      copy:
        dest: "{{ SONAR_HOME }}/Dockerfile"
        content: |
          {% raw %}FROM sonarqube:community

          USER root

          ENV DEBIAN_FRONTEND=noninteractive

          COPY root-ca.crt /usr/local/share/ca-certificates/root-ca.crt
          RUN update-ca-certificates

          RUN keytool -importcert -noprompt \
            -alias root-ca \
            -file /usr/local/share/ca-certificates/root-ca.crt \
            -keystore "$JAVA_HOME/lib/security/cacerts" \
            -storepass changeit

          RUN apt update && \
            apt install -y \
            ca-certificates \
            gnupg \
            wget \
            curl \
            rsync \
            jq \
            zip \
            lsb-release
          
          USER sonarqube
          {% endraw %}

    - name: Sonar | Build docker image
      shell: |
        cd {{ SONAR_HOME }}
        docker build -t registry.labs.sec4us.com.br/ci/sonarqube:sec4us .

    - name: Sonar | Registry docker image
      shell: |
        cd {{ SONAR_HOME }}
        docker push registry.labs.sec4us.com.br/ci/sonarqube:sec4us

    - name: Sonar | Creating docker-compose.yml
      copy:
        dest: "{{ SONAR_HOME }}/docker-compose.yml"
        content: |
          services:
            sonarqube:
              image: registry.labs.sec4us.com.br/ci/sonarqube:sec4us
              container_name: sonarqube
              depends_on:
                - db
              restart: always
    
              ulimits:
                nofile:
                  soft: 131072
                  hard: 131072
                nproc:
                  soft: 8192
                  hard: 8192
                  
              extra_hosts:
                - "{{vault_host}}:host-gateway"
                - "{{gitlab_host}}:host-gateway"
                - "{{artifactory_host}}:host-gateway"
                - "{{jenkins_host}}:host-gateway"
                - "{{sonar_host}}:host-gateway"
                - "{{web01_host}}:host-gateway"
                - "{{registry_host}}:host-gateway"

              ports:
                - "9000:9000"

              environment:
                TZ: America/Sao_Paulo
                SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
                SONAR_JDBC_USERNAME: sonar
                SONAR_JDBC_PASSWORD: sonar

              volumes:
                - {{ SONAR_HOME }}/sonarqube/data:/opt/sonarqube/data
                - {{ SONAR_HOME }}/sonarqube/extensions:/opt/sonarqube/extensions
                - {{ SONAR_HOME }}/sonarqube/logs:/opt/sonarqube/logs

            db:
              image: postgres:15
              container_name: sonarqube-db
              restart: always

              environment:
                TZ: America/Sao_Paulo
                POSTGRES_USER: sonar
                POSTGRES_PASSWORD: sonar
                POSTGRES_DB: sonar

              volumes:
                - {{ SONAR_HOME }}/postgresql/data:/var/lib/postgresql/data


    - name: Ensure vm.max_map_count for SonarQube
      become: true
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: true

    - name: Ensure fs.file-max for SonarQube
      become: true
      ansible.posix.sysctl:
        name: fs.file-max
        value: "131072"
        state: present
        reload: true

    - name: Sonar | Start service
      shell: |
        cd {{ SONAR_HOME }}
        docker compose up -d

    - name: Sonar | Wait for Sonaq container to be running
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' sonarqube
      register: sonar_running
      retries: 60
      delay: 10
      until: sonar_running.stdout == "true"
      changed_when: false

    - name: Sonar | Wait for port 9000
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9000
        delay: 10
        timeout: 300

    - name: Sonar | Wait for SonarQube to be reachable
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/system/status"
        method: GET
        return_content: true
        status_code: [200]
        validate_certs: false
      register: sonar_status
      retries: 60
      delay: 5
      until: sonar_status.status == 200

    - name: Sonar | Check if default credentials still work (admin/admin)
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/authentication/validate"
        method: GET
        user: "{{ sonar_admin_user }}"
        password: "{{ sonar_admin_old_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200, 401, 403]
        validate_certs: false
      register: sonar_auth
      retries: 60
      delay: 5
      until: sonar_auth.status == 200 or sonar_auth.status == 401 or sonar_auth.status == 403

    - name: Sonar | Generating admin password
      set_fact:
        sonar_admin_new_password: >-
          {{
            (
              lookup('community.general.random_string',
                     length=19,
                     upper=True,
                     lower=True,
                     numbers=True,
                     special=False)
              + (['!','@','#','&','*','_','-','.'] | random)
            )
            | list
            | shuffle
            | join('')
          }}

    - name: Sonar | Change admin password (only when admin/admin is valid)
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/users/change_password"
        method: POST
        user: "{{ sonar_admin_user }}"
        password: "{{ sonar_admin_old_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          login: "{{ sonar_admin_user }}"
          previousPassword: "{{ sonar_admin_old_password }}"
          password: "{{ sonar_admin_new_password }}"
        status_code: [200, 204]
        validate_certs: false
      when: (sonar_auth.status == 200) and (sonar_auth.json.valid | default(false))

    - name: Sonar | Verify new password works
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/authentication/validate"
        method: GET
        user: "{{ sonar_admin_user }}"
        password: "{{ sonar_admin_new_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
        validate_certs: false
      register: sonar_auth_new
      when: (sonar_auth.status == 200) and (sonar_auth.json.valid | default(false))

    - name: Sonar | Store credentials
      ansible.builtin.uri:
        url: "https://{{ vault_host }}/v1/secret/sonarqube/admin"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          url: "https://{{ vault_host }}"
          username: "{{ sonar_admin_user }}"
          password: "{{ sonar_admin_new_password }}"
        validate_certs: false
        status_code: [200, 204]
      no_log: true
      when: (sonar_auth.status == 200) and (sonar_auth.json.valid | default(false))

    - name: Sonar | Show result
      ansible.builtin.debug:
        msg: >-
          Password changed: {{
            (sonar_auth_new.json.valid | default(false))
            if (sonar_auth_new is defined) else
            'skipped (admin/admin not valid or already changed)'
          }}
