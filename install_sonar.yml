---
- hosts: all
  become: yes
  vars:
    ansible_python_interpreter: "/usr/bin/python3"
    SONAR_HOME: /u01/sonar
    sonar_admin_user: "admin"
    sonar_admin_old_password: "admin"

  vars_files:
    - vars.yml

  tasks:
    - include_tasks: 'user_details.yml'
    - include_tasks: 'vault_token.yml'

    - name: Sonar | Configuring NGINX
      copy:
        dest: "/etc/nginx/conf.d/sonar.conf"
        owner: root
        group: root
        mode: 0644
        force: yes
        content: |
          server {
              listen        443 ssl;
              server_name {{ sonar_host }};

              ssl_certificate      /etc/nginx/certs/ssl.cer;
              ssl_certificate_key  /etc/nginx/certs/ssl.key;

              root /dev/null;
              index index.html index.htm;
              try_files $uri $uri/ $uri/404 =404;

              client_max_body_size 100000M;

              location / {
                  proxy_http_version    1.1;
                  proxy_ssl_verify      off;
                  proxy_set_header      Host                $host;
                  proxy_set_header      X-Real-IP           $remote_addr;
                  proxy_set_header      X-Forwarded-For     $remote_addr;
                  proxy_set_header      X-Forwarded-Proto   $scheme;
                  proxy_pass http://127.0.0.1:9000;
              }
          
          }

    - name: Sonar | Reload nginx config
      shell: |
        nginx -s reload

    - name: Sonar | Create directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "root"
        group: "root"
        mode: 0777
      with_items:
          - { path: "{{ SONAR_HOME }}" }

    - name: Sonar | Creating docker-compose.yml
      copy:
        dest: "{{ SONAR_HOME }}/docker-compose.yml"
        content: |
          services:
            sonarqube:
              image: sonarqube:lts-community
              container_name: sonarqube
              depends_on:
                - db
              restart: always

              ports:
                - "9000:9000"

              environment:
                TZ: America/Sao_Paulo
                SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
                SONAR_JDBC_USERNAME: sonar
                SONAR_JDBC_PASSWORD: sonar

              volumes:
                - sonarqube_data:/opt/sonarqube/data
                - sonarqube_extensions:/opt/sonarqube/extensions
                - sonarqube_logs:/opt/sonarqube/logs

            db:
              image: postgres:15
              container_name: sonarqube-db
              restart: unless-stopped

              environment:
                POSTGRES_USER: sonar
                POSTGRES_PASSWORD: sonar
                POSTGRES_DB: sonar

              volumes:
                - postgresql_data:/var/lib/postgresql/data

          volumes:
            sonarqube_data:
            sonarqube_extensions:
            sonarqube_logs:
            postgresql_data:

    - name: Ensure vm.max_map_count for SonarQube
      become: true
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: true

    - name: Sonar | Start service
      shell: |
        cd {{ SONAR_HOME }}
        docker compose up -d

    - name: Sonar | Wait for Sonaq container to be running
      ansible.builtin.command: docker inspect -f '{{ "{{" }}.State.Running{{ "}}" }}' sonarqube
      register: sonar_running
      retries: 60
      delay: 10
      until: sonar_running.stdout == "true"
      changed_when: false

    - name: Jenkins | Wait for port 9000
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9000
        delay: 10
        timeout: 300

    - name: Sonar | Wait for SonarQube to be reachable
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/system/status"
        method: GET
        return_content: true
        status_code: [200]
        validate_certs: false
      register: sonar_status
      retries: 60
      delay: 5
      until: sonar_status.status == 200

    - name: Sonar | Check if default credentials still work (admin/admin)
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/authentication/validate"
        method: GET
        user: "{{ sonar_admin_user }}"
        password: "{{ sonar_admin_old_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200, 401, 403]
        validate_certs: false
      register: sonar_auth

    - name: Sonar | Generating admin password
      set_fact:
        sonar_admin_new_password: "{{ lookup('community.general.random_string', upper=True, numbers=True, special=false, length=30) }}"

    - name: Sonar | Change admin password (only when admin/admin is valid)
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/users/change_password"
        method: POST
        user: "{{ sonar_admin_user }}"
        password: "{{ sonar_admin_old_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body:
          login: "{{ sonar_admin_user }}"
          previousPassword: "{{ sonar_admin_old_password }}"
          password: "{{ sonar_admin_new_password }}"
        status_code: [200, 204]
        validate_certs: false
      when: (sonar_auth.status == 200) and (sonar_auth.json.valid | default(false))

    - name: Sonar | Verify new password works
      ansible.builtin.uri:
        url: "https://{{ sonar_host }}/api/authentication/validate"
        method: GET
        user: "{{ sonar_admin_user }}"
        password: "{{ sonar_admin_new_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
        validate_certs: false
      register: sonar_auth_new
      when: (sonar_auth.status == 200) and (sonar_auth.json.valid | default(false))

    - name: Sonar | Store credentials
      ansible.builtin.uri:
        url: "https://{{ vault_host }}/v1/secret/sonarqube/admin"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
        body_format: json
        body:
          url: "https://{{ vault_host }}"
          username: "{{ sonar_admin_user }}"
          password: "{{ sonar_admin_new_password }}"
        validate_certs: false
        status_code: [200, 204]
      no_log: true

    - name: Sonar | Show result
      ansible.builtin.debug:
        msg: >-
          Password changed: {{
            (sonar_auth_new.json.valid | default(false))
            if (sonar_auth_new is defined) else
            'skipped (admin/admin not valid or already changed)'
          }}
