---
- name: "List existing projects"
  uri:
    url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects"
    method: "GET"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_admin_token }}"
    validate_certs: false
    return_content: true
  register: projects_list_output

- name: "Check if project exists"
  set_fact:
    project_exists: "{{ gitlab_project_group + '/' + gitlab_project_name in\
      (projects_list_output.json | map(attribute='path_with_namespace')  | list) }}"

- name: "Get project ID"
  set_fact:
    gitlab_project_id: "{{ item.id }}"
  loop: "{{ projects_list_output.json }}"
  when:
    - project_exists
    - item.path_with_namespace == gitlab_project_group + '/' + gitlab_project_name
  no_log: true

- name: "Delete project"
  uri:
    url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects/{{ gitlab_project_id }}?permanently_remove=true&full_path={{ gitlab_project_group }}/{{ gitlab_project_name }}"
    method: "DELETE"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_admin_token }}"
    validate_certs: false
    return_content: true
    status_code: [202, 204]
  register: project_delete_output
  when: project_exists

- name: "Wait for project to be fully deleted"
  uri:
    url: "{{ gitlab_external_url }}/api/{{ gitlab_api_version }}/projects/{{ gitlab_project_group }}%2F{{ gitlab_project_name }}"
    method: "GET"
    headers:
      PRIVATE-TOKEN: "{{ gitlab_admin_token }}"
    validate_certs: false
    status_code: [404]
  register: project_delete_check
  retries: 30
  delay: 5
  until: project_delete_check.status == 404
  when: project_exists

- name: "Project delete debug"
  debug:
    msg: "Project {{ gitlab_project_group }}/{{ gitlab_project_name }} {{ 'deleted' if project_exists else 'not found, nothing to do' }}"
